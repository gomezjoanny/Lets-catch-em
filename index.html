const TR=[{id:"m1",t:"AML fundamentals",min:10,pts:["Laundering has three stages: placement (getting cash into the system), layering (moving it to hide the trail) and integration (using it as apparently clean money).","The FATF Recommendations are the global standard, applied with a risk-based approach.","Your duties: know your customer, monitor activity, report suspicion and never tip the customer off."],q:[{q:"Moving funds through many accounts to hide their origin is called…",o:["Placement","Layering","Integration","Structuring"],a:1,e:"Layering obscures the audit trail."},{q:"A risk-based approach means…",o:["Treating every customer the same","Focusing controls where risk is highest","Monitoring only cash","Skipping low-risk customers"],a:1,e:"Controls scale with risk, but low risk still gets baseline checks."},{q:"A customer asks whether you reported them. You should…",o:["Confirm it","Explain the reasons","Neither confirm nor deny, and tell your MLRO","Ask a colleague to tell them"],a:2,e:"Tipping off is an offence in most jurisdictions."}]},
{id:"m2",t:"KYC, CDD and EDD",min:10,pts:["KYC verifies identity, and beneficial owners for entities. CDD adds the purpose of the relationship, expected activity and ongoing monitoring.","EDD applies to higher risk: PEPs, High-risk countries and complex structures. It adds senior approval and source-of-wealth checks.","Reviews run on a cycle tied to risk, and whenever a trigger event such as an alert occurs."],q:[{q:"Who needs senior management approval before onboarding?",o:["Every customer","PEPs and other high-risk customers","Only companies","Nobody"],a:1,e:"EDD for PEPs includes senior approval (FATF R12)."},{q:"Which is part of CDD for a company?",o:["Only the registered address","Identifying beneficial owners","Directors’ ages","A credit score"],a:1,e:"You must know who ultimately owns or controls it."},{q:"Turnover is five times the declared level. First step?",o:["Close the account","Ignore it","Compare with the profile, ask for an explanation and document it","Tell the customer you are suspicious"],a:2,e:"Investigate and record before deciding."}]},
{id:"m3",t:"Sanctions and PEPs",min:10,pts:["Sanctions screening is not risk-based: a confirmed match means freezing or blocking and reporting under local law.","Secondary identifiers (date of birth, nationality, ID number) clear false positives, especially for common names.","PEP status is not wrongdoing; it triggers enhanced scrutiny."],q:[{q:"Same name as a sanctioned person, but a different date of birth and nationality.",o:["Freeze the account","Likely a false positive: document why","Ignore the hit","Report the customer"],a:1,e:"Record the identifiers you used to clear it."},{q:"A confirmed sanctions match requires…",o:["Monitoring only","Freezing or blocking and escalation under law","A risk score","Customer outreach"],a:1,e:"There is no risk-based discretion on confirmed matches."},{q:"A PEP is…",o:["A convicted person","Someone with a prominent public function, needing EDD","A sanctioned person","A shell company"],a:1,e:"Higher risk of exposure to corruption, not proof of it."}]},
{id:"m4",t:"Transaction monitoring",min:10,pts:["Rules flag patterns such as structuring, pass-through activity and wires to high-risk jurisdictions.","Every alert needs a documented decision (close, escalate or SAR) with reasons.","Judge activity against the customer’s profile and counterparties, not the amount alone."],q:[{q:"Several cash deposits just under the reporting threshold in one week.",o:["Pass-through","Structuring","Trade mispricing","Chip dumping"],a:1,e:"Splitting deposits to avoid reporting is structuring."},{q:"A large wire fits the customer’s profile and the counterparty’s business. Best action?",o:["Escalate to SAR","Close with a documented rationale","Freeze the account","Call the customer"],a:1,e:"Consistent activity can be closed, with reasons on file."},{q:"Funds arrive and leave within 48 hours with little retained.",o:["Normal payroll","Pass-through or layering","Dormant account","Cash intensive business"],a:1,e:"Rapid in-and-out movement is a layering red flag."}]},
{id:"m5",t:"SAR writing",min:10,pts:["File when you know, suspect or have reasonable grounds to suspect laundering. Proof is not required.","A good narrative covers who, what, when, where, why and how, in plain language.","Keep it confidential: no tipping off, and share only with approved recipients on approved channels."],q:[{q:"The usual standard for filing a SAR is…",o:["Proof of a crime","A court order","Knowledge or reasonable suspicion","A customer complaint"],a:2,e:"Suspicion is enough."},{q:"A strong narrative covers…",o:["Only amounts","Who, what, when, where, why and how","Only the subject’s name","Legal opinions"],a:1,e:"Give the reader the full story."},{q:"Can a SAR go on a personal messaging app?",o:["Yes, always","Only if policy allows; default to approved secure channels","Yes, if masked","Yes, to the customer"],a:1,e:"Confidentiality rules usually forbid it."}]},
{id:"m6",t:"Correspondent banking",min:10,pts:["You process payments for the respondent’s customers, so risk is high.","Never deal with shell banks. Check licensing, supervision, AML programme and sanctions controls (FATF R13).","Nested relationships and payable-through accounts need extra scrutiny."],q:[{q:"A shell bank is…",o:["A small bank","A bank with no physical presence and no regulated group","A foreign bank","A private bank"],a:1,e:"Relationships with shell banks are prohibited."},{q:"The respondent offers payable-through accounts. Risk?",o:["Lower","Higher: third parties may transact directly","None","Only tax risk"],a:1,e:"You lose sight of the end users."},{q:"Before approving a new respondent you should…",o:["Open the account","Complete due diligence and get senior approval","Ask for a deposit","Check its website"],a:1,e:"Approval follows documented due diligence."}]},
{id:"m7",t:"Typologies and red flags",min:10,pts:["Common typologies: structuring, pass-through accounts, funnel accounts, trade misinvoicing, shell companies and mixers.","Scam compounds run fraud at industrial scale and rely on mule accounts and crypto to move proceeds.","Red flags matter in combination and against the customer’s profile."],q:[{q:"Many small payments from unrelated senders, then one large wire out.",o:["Payroll","Funnel or mule account","Dividend","Loan repayment"],a:1,e:"Pooling then moving on is a funnel pattern."},{q:"Property bought via an opaque shell with nominee directors suggests…",o:["A bargain","Hidden beneficial ownership","Low risk","A mortgage"],a:1,e:"Opacity is the red flag."},{q:"A single red flag on its own…",o:["Proves laundering","Is not proof: assess in context","Is always a SAR","Can be ignored"],a:1,e:"Context decides."}]},
{id:"m8",t:"Virtual assets and trade-based ML",min:10,pts:["Travel rule: VASPs pass originator and beneficiary information with transfers (FATF R16).","Mixers and unhosted wallets raise risk. Screen wallet addresses and counterparties.","Trade-based laundering abuses invoices: over- or under-invoicing, multiple invoicing and phantom shipments."],q:[{q:"An invoice far above market price for the same goods suggests…",o:["A premium brand","Possible trade misinvoicing","Tax relief","Nothing"],a:1,e:"Mispricing moves value across borders."},{q:"The travel rule requires…",o:["Wallet encryption","Originator and beneficiary information with transfers","Cash limits","Annual audits"],a:1,e:"Information must travel with the payment."},{q:"Crypto sent to a mixing service within hours of receipt.",o:["Low risk","High risk: escalate","Normal","A tax matter"],a:1,e:"Mixers obscure the trail."}]}];

const cfg={structMin:8000,structMax:9999,structCount:3,structDays:7,ctr:10000,passPct:90,passHrs:48,hrAmt:5000,medAmt:25000,bigWire:50000,rapidAmt:10000,rapidPct:90,rapidHrs:24,fanN:5,fanDays:3,manyN:5,manyDays:7,xbAmt:50000,xbCtry:3,cashCum:25000,cashN:5,posMult:2,w:{struct:40,ctr:15,pass:35,hr:30}};
const ts=t=>t.d*24+t.h;
function run(){const out=[];let n=1;const A=(c,rule,sev,sc,ids,desc)=>out.push({id:"A"+String(n++).padStart(3,"0"),c,rule,sev,sc,ids,desc});
cust.forEach(c=>{const T=tx.filter(t=>t.c==c.id).sort((a,b)=>ts(a)-ts(b));
const sm=T.filter(t=>t.type=="cash_in"&&t.amt>=cfg.structMin&&t.amt<=cfg.structMax);
for(let i=0;i+cfg.structCount<=sm.length;i++){const g=sm.slice(i,i+cfg.structCount);if(g[g.length-1].d-g[0].d<=cfg.structDays){A(c.id,"Structuring","High",cfg.w.struct,g.map(x=>x.id),cfg.structCount+" cash deposits just under reporting threshold within "+cfg.structDays+" days");break}}
T.filter(t=>t.type=="cash_in"&&t.amt>=cfg.ctr).forEach(t=>A(c.id,"Large cash","Medium",cfg.w.ctr,[t.id],"Cash deposit of $"+t.amt.toLocaleString()+" (currency report threshold)"));
T.filter(t=>t.type=="wire_in").forEach(i=>{const o=T.find(t=>t.type=="wire_out"&&ts(t)>=ts(i)&&ts(t)-ts(i)<=cfg.passHrs&&t.amt>=i.amt*cfg.passPct/100);if(o&&i.amt>=10000)A(c.id,"Pass-through","High",cfg.w.pass,[i.id,o.id],"Inbound wire $"+i.amt.toLocaleString()+" moved out within "+cfg.passHrs+"h")});
T.filter(t=>(t.type=="wire_out"||t.type=="wire_in")&&jt(t.cp)=="High"&&t.amt>=cfg.hrAmt).forEach(t=>A(c.id,"High-risk jurisdiction","High",cfg.w.hr,[t.id],"Wire of $"+t.amt.toLocaleString()+(t.type=="wire_in"?" from ":" to ")+t.cp))});
cust.forEach(c=>{const T=tx.filter(t=>t.c==c.id).sort((a,b)=>ts(a)-ts(b));
T.filter(t=>t.type=="crypto_in").forEach(i=>{const o=T.find(t=>t.type=="crypto_out"&&ts(t)>=ts(i)&&ts(t)-ts(i)<=24&&t.amt>=i.amt*.9);if(o)A(c.id,"Crypto rapid cash-out","High",30,[i.id,o.id],"Crypto received then moved out within 24h to "+o.cp)});
T.filter(t=>t.type=="chip_buy").forEach(i=>{const o=T.find(t=>t.type=="chip_cash"&&ts(t)>=ts(i)&&ts(t)-ts(i)<=24&&t.amt>=i.amt*.8);if(o)A(c.id,"Chip dumping","Medium",25,[i.id,o.id],"Chips bought and cashed out within 24h with minimal play")});
T.filter(t=>t.type=="premium"&&t.amt>=25000).forEach(i=>{const o=T.find(t=>t.type=="surrender"&&t.d-i.d<=30&&t.d>=i.d);if(o)A(c.id,"Early surrender","Medium",25,[i.id,o.id],"Large premium surrendered within "+(o.d-i.d)+" days")});
T.filter(t=>(t.type=="wire_out"||t.type=="wire_in")&&jt(t.cp)=="Medium"&&t.amt>=cfg.medAmt).forEach(t=>A(c.id,"Medium-risk jurisdiction","Medium",15,[t.id],"Wire of $"+t.amt.toLocaleString()+" "+(t.type=="wire_in"?"from ":"to ")+t.cp+" (Medium tier)"));
T.filter(t=>t.type=="crypto_out"&&t.p=="MIXER").forEach(t=>A(c.id,"Mixer exposure","High",30,[t.id],"Outbound crypto of $"+t.amt.toLocaleString()+" to a mixing service"));
T.filter(t=>t.type=="property_buy"&&t.p=="SHELL").forEach(t=>A(c.id,"Shell-company property purchase","High",30,[t.id],"Property purchase of $"+t.amt.toLocaleString()+" via opaque shell entity in "+t.cp+" ("+jt(t.cp)+" tier)"));
T.filter(t=>t.type=="wire_out"&&t.amt>=cfg.bigWire&&(CPM[t.p]||{}).ind).forEach(t=>A(c.id,"Large wire to individual","Medium",20,[t.id],"Wire of $"+t.amt.toLocaleString()+" to "+pname(t)+" ("+t.cp+")"));
const inb=T.filter(t=>t.p&&(t.type=="ach_in"||t.type=="wire_in"));const ps=new Set(inb.map(t=>t.p));const wo=inb.length?T.find(t=>t.type=="wire_out"&&t.d>=inb[0].d&&t.d-inb[0].d<=3):0;if(ps.size>=5&&wo)A(c.id,"Funnel / mule","High",35,[...inb.map(t=>t.id),wo.id],ps.size+" distinct senders then outbound wire within 3 days");
{const O=T.filter(t=>["ach_out","wire_out"].includes(t.type)&&t.p).sort((a,b)=>ts(a)-ts(b));for(let i=0;i<O.length;i++){const g=O.filter(t=>ts(t)>=ts(O[i])&&ts(t)-ts(O[i])<=cfg.fanDays*24),n=new Set(g.map(t=>t.p)).size;if(n>=cfg.fanN){A(c.id,"One originator, multiple beneficiaries","Medium",25,g.map(t=>t.id),"Sent to "+n+" different beneficiaries within "+cfg.fanDays+" days, $"+g.reduce((s,t)=>s+t.amt,0).toLocaleString());break}}}
if(!out.some(a=>a.c==c.id&&a.rule=="Funnel / mule")){const I=T.filter(t=>["ach_in","wire_in"].includes(t.type)&&t.p).sort((a,b)=>ts(a)-ts(b));for(let i=0;i<I.length;i++){const g=I.filter(t=>ts(t)>=ts(I[i])&&ts(t)-ts(I[i])<=cfg.manyDays*24),n=new Set(g.map(t=>t.p)).size;if(n>=cfg.manyN){A(c.id,"Multiple originators, one beneficiary","Medium",25,g.map(t=>t.id),n+" different originators paid this customer within "+cfg.manyDays+" days, $"+g.reduce((s,t)=>s+t.amt,0).toLocaleString());break}}}
T.filter(t=>["ach_in","cash_in","wire_in"].includes(t.type)&&t.amt>=cfg.rapidAmt).forEach(i=>{const o=T.find(t=>["ach_out","wire_out","crypto_out"].includes(t.type)&&!(i.type=="wire_in"&&t.type=="wire_out")&&ts(t)>=ts(i)&&ts(t)-ts(i)<=cfg.rapidHrs&&t.amt>=i.amt*cfg.rapidPct/100);if(o)A(c.id,"Rapid movement of funds","High",30,[i.id,o.id],"$"+i.amt.toLocaleString()+" received ("+i.type.replace("_"," ")+") and $"+o.amt.toLocaleString()+" sent out within "+(ts(o)-ts(i))+"h")});
{const X=T.filter(t=>["wire_in","wire_out"].includes(t.type)&&t.cp!=c.cty),tot=X.reduce((s,t)=>s+t.amt,0),ct=new Set(X.map(t=>t.cp));if(tot>=cfg.xbAmt&&ct.size>=cfg.xbCtry)A(c.id,"Cross-border payments","Medium",20,X.map(t=>t.id),"$"+tot.toLocaleString()+" in cross-border wires with "+ct.size+" countries ("+[...ct].join(", ")+")")}
if(!out.some(a=>a.c==c.id&&a.rule=="Structuring")){const K=T.filter(t=>t.type=="cash_in"),tot=K.reduce((s,t)=>s+t.amt,0);if(K.length>=cfg.cashN&&tot>=cfg.cashCum)A(c.id,"Unlimited cash deposits","Medium",20,K.map(t=>t.id),K.length+" cash deposits totalling $"+tot.toLocaleString()+" with no cap, against expected turnover of $"+c.exp.toLocaleString())}
{const S=T.filter(t=>t.type=="pos_settle"),R=T.filter(t=>t.type=="pos_refund"),ss=S.reduce((s,t)=>s+t.amt,0),rf=R.reduce((s,t)=>s+t.amt,0);if(S.length&&ss>=cfg.posMult*c.exp)A(c.id,"Card settlement and POS payments","Medium",25,[...S,...R].map(t=>t.id),"Card settlements of $"+ss.toLocaleString()+" ("+(ss/c.exp).toFixed(1)+"x expected turnover) with "+Math.round(rf/ss*100)+"% refunded")}
T.filter(t=>t.type=="trade_pay"&&Math.abs(t.dev)>=30).forEach(t=>A(c.id,"Trade mispricing","Medium",25,[t.id],"Invoice "+(t.dev>0?"over":"under")+"-priced "+Math.abs(t.dev)+"% vs. market benchmark"))});
out.forEach(a=>a.inst=TYP[a.rule].i);
return out.filter(a=>inst=="all"||AUTH[inst]||a.inst.includes(inst))}
const risk=id=>{const c=cust.find(x=>x.id==id);return Math.min(100,c.base+({High:30,Medium:15,Low:0})[jt(c.cty)]+(c.pep?25:0)+alerts.filter(a=>a.c==id).reduce((s,a)=>s+a.sc,0))};
const band=r=>r>=60?"High":r>=30?"Medium":"Low";
let alerts=run(),cases={},tab="Home",open=null;
const cn=id=>cust.find(c=>c.id==id).name,$=x=>document.getElementById(x),esc=t=>String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const tabs=["Dashboard","Alerts","Customers","Jurisdictions","Screening","Rules","Regulatory","Requests","Integrations"];
function navOld(){$("ib").innerHTML='<label class="mu">Institution profile</label><select onchange="inst=this.value;alerts=run();closeA()">'+Object.entries(INST).map(([k,v])=>`<option value="${k}" ${k==inst?"selected":""}>${v}</option>`).join("")+'</select><label class="mu">Theme</label><select onchange="pal=this.value;document.documentElement.dataset.pal=pal;draw()">'+["ocean","emerald","violet","amber"].map(p=>`<option ${p==pal?"selected":""}>${p}</option>`).join("")+'</select><span id="sv" class="mu">'+saveMsg+'</span>';$("nav").innerHTML=navHtml()}
const st=a=>(cases[a.id]||{}).status||"New";
function dash(){const hi=alerts.filter(a=>a.sev=="High").length,op=alerts.filter(a=>st(a)!="Closed").length,sar=alerts.filter(a=>st(a)=="Escalate (SAR)").length;
const byRule={};alerts.forEach(a=>byRule[a.rule]=(byRule[a.rule]||0)+1);const mx=Math.max(...Object.values(byRule),1);
const top=cust.map(c=>({c,r:risk(c.id)})).sort((a,b)=>b.r-a.r).slice(0,5);
return `<div class="grid"><div class="card"><div class="mu">Transactions</div><div class="k">${tx.length}</div></div><div class="card"><div class="mu">Alerts</div><div class="k">${alerts.length}</div></div><div class="card"><div class="mu">High severity</div><div class="k High">${hi}</div></div><div class="card"><div class="mu">Open</div><div class="k">${op}</div></div><div class="card"><div class="mu">SAR escalations</div><div class="k">${sar}</div></div></div>
<div class="card"><h2 style="margin-top:0">Alerts by rule</h2>${Object.entries(byRule).map(([r,n])=>`<div class="row" style="margin:4px 0"><span style="width:160px">${r}</span><div class="bar" style="flex:1"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`).join("")}</div>
<div class="card" style="margin-top:12px"><h2 style="margin-top:0">Highest-risk customers</h2><div class="tw"><table><tr><th>Customer</th><th>Score</th><th>Band</th></tr>${top.map(x=>`<tr><td>${x.c.name}</td><td>${x.r}</td><td><span class="b ${band(x.r)}">${band(x.r)}</span></td></tr>`).join("")}</table></div></div>`}
function alist(){if(open){const a0=alerts.find(x=>x.id==open);if(a0)return adet(a0);open=null}if(false){const a=alerts.find(x=>x.id==open),cs=cases[a.id]||{status:"New",notes:""};
return `<button onclick="open=null;draw()">← Back</button><div class="card" style="margin-top:10px"><h2 style="margin-top:0">${a.id} · ${a.rule} <span class="b ${a.sev}">${a.sev}</span></h2><p>${cn(a.c)} (${a.c}) — ${a.desc}</p>
<div class="tw"><table><tr><th>ID</th><th>Day</th><th>Type</th><th>Amount</th><th>Country</th><th>Counterparty</th></tr>${a.ids.map(i=>{const t=tx.find(x=>x.id==i);return `<tr><td>${t.id}</td><td>${t.d}</td><td>${t.type}</td><td>$${t.amt.toLocaleString()}</td><td>${t.cp}</td><td>${pname(t)}</td></tr>`}).join("")}</table></div>
${rv(a,cs)}
<textarea id="cn" placeholder="Analyst comments and rationale (required)">${esc(cs.notes)}</textarea>
<div class="row"><button class="p" onclick="save('${a.id}')">Save review</button></div>
<div class="mu">${(cs.log||[]).map(l=>esc(l)).join("<br>")}</div>${rep(a,cs)}${xp(a)}</div>`}
return `${tf?`<div class="row"><span class="b">${tf}</span><button onclick="tf='';draw()">Clear filter</button></div>`:""}<div class="card"><div class="row"><b style="flex:1">Alerts</b><button class="p" onclick="startInbox()">Start reviewing</button></div><div class="row">${btns(["To do","Done","All"],AFN[af],v=>`afSet('${v}')`)}<button onclick="allPdf()">Download all results (PDF)</button></div><div class="mu">${shMsg}</div></div><div class="card tw"><table><tr><th>Alert</th><th>Customer</th><th>Rule</th><th>Severity</th><th>Status</th><th>Decision</th></tr>${alerts.filter(a=>(!tf||a.rule==tf)&&(af=="all"||(af=="todo"?unrev(a):!unrev(a)))).sort((a,b)=>prio(b)-prio(a)).map(a=>`<tr class="cl" onclick="openA('${a.id}')"><td>${a.id}</td><td>${cn(a.c)}</td><td>${a.rule}</td><td><span class="b ${a.sev}">${a.sev}</span></td><td>${st(a)}</td><td>${(cases[a.id]||{}).dec||"—"}</td></tr>`).join("")}</table></div>`}
function saveOld(id){const p=cases[id]||{log:[],q:{}},n=$("cn").value.trim(),d=$("cs").value;if(d.startsWith("Select")){cases[id]={...p,status:p.status||"New",notes:$("cn").value,cj:$("cj")?$("cj").value:p.cj,dd:d};errMsg="Please choose a decision.";draw();return}const t2=new Date().toISOString().slice(0,16).replace("T"," ");cases[id]={...p,status:stOf(d),dec:d,dd:d,notes:n,cj:$("cj")?$("cj").value:p.cj,ref:p.ref||"AML-"+id+"-"+t2.slice(0,10).replace(/-/g,""),log:[...(p.log||[]),t2+" · "+d]};draw()}
function custs(){if(kc)return prof();return `<div class="card tw"><table><tr><th>ID</th><th>Name</th><th>Home (tier)</th><th>Base</th><th>Alerts</th><th>Risk</th></tr>${cust.map(c=>({c,r:risk(c.id)})).sort((a,b)=>b.r-a.r).map(x=>`<tr class="cl" onclick="kc='${x.c.id}';draw()"><td>${x.c.id}</td><td>${x.c.name}</td><td>${x.c.cty} · ${jt(x.c.cty)}</td><td>${x.c.base}</td><td>${alerts.filter(a=>a.c==x.c.id).length}</td><td><span class="b ${band(x.r)}">${x.r} ${band(x.r)}</span></td></tr>`).join("")}</table></div>`}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return d[b.length]}
const norm=x=>x.toLowerCase().replace(/[^a-z ]/g,"").split(" ").filter(Boolean).sort().join(" ");
function sim(a,b){a=norm(a);b=norm(b);const m=Math.max(a.length,b.length);return m?1-lev(a,b)/m:0}

function doScr(){const q=$("q").value,th=+$("th").value/100;if(!q){$("res").innerHTML="";return}const r=watch.map(w=>({...w,s:sim(q,w.n)})).filter(w=>w.s>=th).sort((a,b)=>b.s-a.s);$("res").innerHTML=r.length?`<table><tr><th>Match</th><th>List</th><th>Score</th></tr>${r.map(w=>`<tr><td>${w.n}</td><td>${w.l}</td><td>${Math.round(w.s*100)}%</td></tr>`).join("")}</table>`:"<p class='mu'>No matches at this threshold.</p>"}
const F=[["structMin","Structuring band min ($)"],["structMax","Structuring band max ($)"],["structCount","Deposits in window"],["structDays","Window (days)"],["ctr","Large cash threshold ($)"],["passPct","Pass-through % moved out"],["passHrs","Pass-through window (hrs)"],["hrAmt","High-tier wire min ($)"],["medAmt","Medium-tier wire min ($)"],["bigWire","Large wire to individual ($)"],["rapidAmt","Rapid movement min ($)"],["rapidHrs","Rapid movement window (hrs)"],["fanN","Beneficiaries in a fan-out"],["manyN","Originators in a fan-in"],["xbAmt","Cross-border total ($)"],["cashCum","Cash deposits total ($)"],["posMult","POS settlements vs expected (x)"]];
function rules(){return `<div class="card" style="margin-bottom:12px"><h2 style="margin-top:0">Typology library</h2><div class="tw"><table><tr><th>Typology</th><th>Applies to</th></tr>${Object.entries(TYP).map(([k,v])=>`<tr><td>${k}</td><td style="white-space:normal">${v.i.map(x=>INST[x]).join(", ")}</td></tr>`).join("")}</table></div></div><div class="card"><h2 style="margin-top:0">Rule parameters</h2><p class="mu">Document every change and its rationale; thresholds should be tuned and validated against your risk assessment.</p>${F.map(([k,l])=>`<div class="row"><label style="width:220px">${l}</label><input data-k="${k}" value="${cfg[k]}"></div>`).join("")}<div class="row"><button class="p" onclick="apply()">Apply &amp; re-run</button></div></div>`}
